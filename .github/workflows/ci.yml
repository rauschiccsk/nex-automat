name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: [self-hosted, ANDROS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy packages/ apps/ --ignore-missing-imports
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: [self-hosted, ANDROS]
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/unit/ -v --tb=short
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: [self-hosted, ANDROS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Bandit scan
        shell: bash
        run: bandit -r packages/ apps/ -ll -x "*/tests/*" || true

  build:
    name: Docker Build
    runs-on: [self-hosted, ANDROS]
    needs: [lint, test]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.nex-brain
            image: nex-brain
          - dockerfile: Dockerfile.telegram
            image: nex-telegram
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha_tag=$SHA_SHORT" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "latest_tag=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "latest_tag=stable" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: |
            ${{ matrix.image }}:${{ steps.tags.outputs.sha_tag }}
            ${{ matrix.image }}:${{ steps.tags.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build summary
        run: |
          echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ matrix.image }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile | ${{ matrix.dockerfile }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA Tag | ${{ steps.tags.outputs.sha_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest Tag | ${{ steps.tags.outputs.latest_tag }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # Frontend Tests (Vitest + React Testing Library)
  # ===========================================
  frontend-tests:
    name: Frontend Tests
    runs-on: [self-hosted, ANDROS]
    needs: [lint]
    defaults:
      run:
        working-directory: apps/frontend/nex-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run coverage check
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/nex-manager/coverage/
          retention-days: 7

  # ===========================================
  # Staging Deploy Backend (DEPTEST) — Linux runner, Docker compose
  # ===========================================
  deploy-staging-backend:
    name: Deploy Backend to Staging (DEPTEST)
    needs: [lint, test, security, build, frontend-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: [self-hosted, ANDROS]
    environment: staging-DEPTEST
    timeout-minutes: 15

    steps:
      - name: Pull latest source
        run: |
          cd /opt/nex-automat-src
          git pull origin develop

      - name: Deploy DEPTEST staging (Temporal + PostgreSQL)
        run: |
          docker compose -f /opt/nex-automat-src/deployment/docker/docker-compose.deptest.yml --env-file /opt/nex-automat-src/deployment/docker/.env.deptest up -d

      - name: Rebuild and restart nex-manager-api
        run: |
          cd /opt/nex-automat
          docker rm -f nex-manager-api 2>/dev/null || true
          export APP_VERSION=$(cd /opt/nex-automat-src && git describe --tags --abbrev=0 2>/dev/null || echo "0.2.0")
          export APP_COMMIT=$(cd /opt/nex-automat-src && git rev-parse --short HEAD)
          docker compose build --no-cache --build-arg APP_VERSION=$APP_VERSION --build-arg APP_COMMIT=$APP_COMMIT nex-manager-api
          docker compose up -d nex-manager-api

      - name: Health check — DEPTEST containers
        run: |
          sleep 15
          unhealthy=$(docker compose -f /opt/nex-automat-src/deployment/docker/docker-compose.deptest.yml --env-file /opt/nex-automat-src/deployment/docker/.env.deptest ps --status running --format "{{.Name}}" | wc -l)
          total=$(docker compose -f /opt/nex-automat-src/deployment/docker/docker-compose.deptest.yml --env-file /opt/nex-automat-src/deployment/docker/.env.deptest ps --format "{{.Name}}" | wc -l)
          echo "Running: $unhealthy / Total: $total"
          if [ "$unhealthy" -eq "$total" ] && [ "$total" -gt 0 ]; then
            echo "✅ All $total DEPTEST containers running"
          else
            docker compose -f /opt/nex-automat-src/deployment/docker/docker-compose.deptest.yml --env-file /opt/nex-automat-src/deployment/docker/.env.deptest ps
            docker compose -f /opt/nex-automat-src/deployment/docker/docker-compose.deptest.yml --env-file /opt/nex-automat-src/deployment/docker/.env.deptest logs --tail=20
            echo "❌ DEPTEST health check failed"
            exit 1
          fi

      - name: Health check — nex-manager-api
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9110/health)
          echo "nex-manager-api /health → HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ nex-manager-api healthy"
          else
            docker logs nex-manager-api --tail=20
            echo "❌ nex-manager-api health check failed"
            exit 1
          fi

      - name: Auto-increment version tag
        run: |
          cd /opt/nex-automat-src
          git fetch --tags origin
          # Find highest v0.x.y tag globally (sort -V = natural version sort).
          # Filter to v0.* excludes unrelated v2.* / v3.* tags from hotfix
          # branches that would poison the bump base. Previous logic used
          # `git describe --tags --abbrev=0` which returns the most recent
          # *ancestor* tag — missed tags created on parallel branches —
          # caused 'v0.2.37 already exists' on every push.
          LAST_TAG=$(git tag -l 'v0.[0-9]*.[0-9]*' | sort -V | tail -1)
          [ -z "$LAST_TAG" ] && LAST_TAG="v0.0.0"
          VERSION=${LAST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          # Defensive loop — paralel pushes, reruns, race conditions.
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
              NEW_PATCH=$((NEW_PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  # ===========================================
  # E2E Tests (Playwright)
  # ===========================================
  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, ANDROS]
    needs: [deploy-staging-backend]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[e2e]') ||
      github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: e2e
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for staging services
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:9110/api/system/modules > /dev/null && break
            sleep 2
          done
          echo "Backend ready."

      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:9110
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_NAZAR_PASSWORD: ${{ secrets.E2E_NAZAR_PASSWORD }}
        continue-on-error: true

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 3
