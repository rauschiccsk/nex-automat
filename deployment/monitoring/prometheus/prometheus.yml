global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules.yml'
  - '/etc/prometheus/rules.customers.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics (node-exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Docker container metrics (cadvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Auto-added by onboard-customer.sh for customer 'icc'
  - job_name: 'customer-icc-postgres'
    static_configs:
      - targets: ['icc-postgres-exporter:9187']
        labels:
          customer: 'icc'

  # Blackbox HTTP probe for customer 'icc'
  # (one job per customer — extended by onboard-customer.sh)
  - job_name: 'blackbox-customer-icc'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://icc.isnex.eu/']
        labels:
          customer: 'icc'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Auto-added by onboard-customer.sh for customer 'emt'
  - job_name: 'customer-emt-postgres'
    static_configs:
      - targets: ['emt-postgres-exporter:9187']
        labels:
