# Docker embedded DNS resolver — needed for variable-based proxy_pass below.
# Without resolver, nginx tries to resolve "backend" at startup and crashes
# if absent (DEPTEST has no backend service in same network).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API proxy — production stack only. Per-customer Docker network has a
  # service named "backend" reachable at this DNS name. DEPTEST has no
  # /api/* requests hitting frontend (browser uses absolute VITE_API_URL),
  # so this block is dormant there.
  location /api/ {
    set $backend_upstream http://backend:9110;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — všetky neexistujúce cesty → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
